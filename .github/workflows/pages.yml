name: Планер и обновление афиши

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 2,14 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/cache/restore@v4
        with:
          path: .afisha-cache
          key: afisha-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: afisha-v1-
      - name: Update the theater schedule
        run: |
          baseline=afisha.json
          if test -s .afisha-cache/afisha.json; then baseline=.afisha-cache/afisha.json; fi
          python3 sync_afisha.py --baseline "$baseline" --output .afisha-cache/afisha.json
          mkdir -p dist
          cp index.html styles.css app.js planner.js accounts.js config.js mark.svg curtain.svg dist/
          cp .afisha-cache/afisha.json dist/afisha.json
      - uses: actions/cache/save@v4
        with:
          path: .afisha-cache
          key: afisha-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
